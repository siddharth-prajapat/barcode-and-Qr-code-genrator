<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>QR Code Generator</title>
  <style>
    body { font-family: sans-serif;  padding: 40px; 
    backgro}
    input {
      padding: 8px; font-size: 16px; width: 200px;
      border-radius: 20px; outline: none; border: none; padding-left: 20px;
    }
    button {
      padding: 8px 16px; font-size: 16px; margin: 4px; cursor: pointer;
      background-color: blue; color: white; border: none; border-radius: 20px;
    }
    #msg { color: red; margin-top: 10px; }
    .container {
      background-color: antiquewhite; width: 400px;
      margin: 0 auto; padding: 20px; border-radius: 20px;
    }
    .barcode { display: none; margin-top: 20px; }
    #qr img { width: 250px; height: 250px; }
        a{
        text-decoration:none;
        color:white;

    }
  </style>
</head>
<body>
      <button>
    <a href="barcode.html">Barcode Genrator</a></button>
  <div class="container">
    <h2>QR Code Generator</h2>

    <input id="text" placeholder="Enter Your Link" />
    <button onclick="generate()">Generate</button>

    <p id="msg"></p>

    <div class="barcode">
      <div id="qr"></div>
      <button onclick="downloadPNG()">Download PNG</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script>
    function generate() {
      const value = document.getElementById("text").value.trim();
      const msg = document.getElementById("msg");
      const box = document.querySelector(".barcode");

      msg.textContent = "";
      box.style.display = "none";

      if (!value) {
        msg.textContent = "Pehle kuch likho.";
        return;
      }

      try {
        const qr = qrcode(0, "M");      // 0 = size automatic, M = error correction
        qr.addData(value);
        qr.make();
        document.getElementById("qr").innerHTML = qr.createImgTag(10, 20);
        box.style.display = "block";
      } catch (e) {
        msg.textContent = "QR nahi ban paya, text bahut lamba ho sakta hai.";
      }
    }

    function downloadPNG() {
      const img = document.querySelector("#qr img");
      const link = document.createElement("a");
      link.download = "qrcode.png";
      link.href = img.src;
      link.click();
    }
  </script>
</body>
</html>
