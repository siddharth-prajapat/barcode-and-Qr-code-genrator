<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>UPC-A Barcode Generator</title>
  <style>
    body { font-family: sans-serif;  padding: 40px; }
    input { padding: 8px; font-size: 16px; width: 200px; 
    border-radius:20px; outline:none;
border:none;
padding-left:px;}
    button { padding: 8px 16px; font-size: 16px; margin: 4px; cursor: pointer; }
    #msg { color: red; margin-top: 10px; }
    .container{
        background-color:antiquewhite;
        width:400px;
       margin:0 auto;
        padding:20px;
        border-radius:20px;
    }
    button{
        background-color:blue;
        color:white;
        border-radius:20px;

    }
    .barcode{
        display:none;
    }
    a{
        text-decoration:none;
        color:white;

    }
  </style>
</head>
<body>
    <button>
    <a href="qr.html">QR code Genrator</a></button>
    <div class="container">
  <h2>UPC-A Barcode Generator</h2>

  <input id="code" placeholder="Enter 12 digits number" maxlength="12" />
  <button onclick="generate()">Generate</button>
 

  <p id="msg"></p>
  <div class="barcode">
  <canvas id="barcode"></canvas>
 <button onclick="downloadPNG()">Download PNG</button>  
</div>
  
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
    function generate() {
      const value = document.getElementById("code").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (!/^\d{11,12}$/.test(value)) {
        msg.textContent = "Sirf 11 ya 12 digit daalo (letters nahi).";
        return;

      }

      try {
        JsBarcode("#barcode", value, {
          format: "CODE128",
          width: 3,
          height: 120,
          displayValue: true,
          margin: 20,
          background: "#ffffff"
        });
      } catch (e) {
        msg.textContent = "Invalid number. 12 digit me check digit galat hai.";
      }
      document.querySelector(".barcode").style.display = "block";
    }

    function downloadPNG() {
      const canvas = document.getElementById("barcode");
      const link = document.createElement("a");
      link.download = "upc-barcode.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
        
    }
  </script>
</body>
</html>
